name: Test and deploy Snake Web
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/*.test.cjs
      - run: node --check js/utils.js && node --check js/snake.js
      - name: Install Playwright test runner and Chromium
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.56.1
          npx playwright install --with-deps chromium
      - name: Browser gameplay smoke tests
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 &
          npx playwright test tests/browser.spec.cjs --workers=1
  deploy:
    if: github.event_name != 'pull_request'
    needs: [test]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage static site only
        run: |
          mkdir -p dist/js
          cp index.html style.css dist/
          cp js/utils.js js/snake.js dist/js/
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
